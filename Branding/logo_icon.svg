<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12032B"/>
      <stop offset="0.55" stop-color="#2B0A55"/>
      <stop offset="1" stop-color="#0C0220"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE45C"/>
      <stop offset="0.5" stop-color="#FF7A3D"/>
      <stop offset="1" stop-color="#FF2E88"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#9EF3FF"/>
      <stop offset="0.5" stop-color="#2E7BFF"/>
      <stop offset="1" stop-color="#B57CFF"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FFF1F1"/>
      <stop offset="0.3" stop-color="#FF4D4D"/>
      <stop offset="1" stop-color="#A3001B"/>
    </radialGradient>
    <radialGradient id="body" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#4B4F6B"/>
      <stop offset="1" stop-color="#14162A"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <clipPath id="tile"><rect width="1024" height="1024" rx="224"/></clipPath>
    <clipPath id="sunclip">
      <rect x="0" y="0" width="1024" height="590"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#sky)"/>

    <!-- synthwave sun with slits -->
    <g clip-path="url(#sunclip)">
      <circle cx="512" cy="560" r="330" fill="#FF2E88" opacity="0.5" filter="url(#bigglow)"/>
      <circle cx="512" cy="560" r="300" fill="url(#sun)"/>
      <g fill="#2B0A55">
        <rect x="150" y="430" width="724" height="10"/>
        <rect x="150" y="470" width="724" height="15"/>
        <rect x="150" y="512" width="724" height="21"/>
        <rect x="150" y="556" width="724" height="28"/>
      </g>
    </g>

    <!-- neon grid floor -->
    <rect x="0" y="590" width="1024" height="434" fill="#0C0220"/>
    <g stroke="#FF2E88" stroke-width="4" fill="none" filter="url(#glow)" opacity="0.85">
      <path d="M0 590 H1024"/>
      <path d="M0 625 H1024"/><path d="M0 675 H1024"/><path d="M0 745 H1024"/><path d="M0 845 H1024"/><path d="M0 990 H1024"/>
      <path d="M512 590 V1024"/>
      <path d="M512 590 L300 1024"/><path d="M512 590 L724 1024"/>
      <path d="M512 590 L80 1024"/><path d="M512 590 L944 1024"/>
      <path d="M512 590 L-160 1024"/><path d="M512 590 L1184 1024"/>
    </g>

    <!-- crosshair -->
    <g filter="url(#glow)" stroke="#3CF0FF" fill="none" stroke-linecap="round">
      <circle cx="512" cy="400" r="235" stroke-width="14" stroke-dasharray="300 70" transform="rotate(-20 512 400)"/>
      <circle cx="512" cy="400" r="175" stroke-width="6" opacity="0.7"/>
      <path d="M512 120 V200" stroke-width="16"/>
      <path d="M512 600 V680" stroke-width="16"/>
      <path d="M232 400 H312" stroke-width="16"/>
      <path d="M712 400 H792" stroke-width="16"/>
    </g>

    <!-- drone -->
    <g transform="translate(512 395)">
      <!-- rotor -->
      <g stroke="#C9CCE0" stroke-width="12" stroke-linecap="round">
        <path d="M0 -105 V-80"/>
        <path d="M-120 -112 H120" stroke-width="10" opacity="0.9"/>
      </g>
      <ellipse cx="0" cy="-112" rx="135" ry="10" fill="#C9CCE0" opacity="0.25"/>
      <!-- wings -->
      <path d="M-105 -10 L-185 -40 L-178 20 Z" fill="#14162A" stroke="#FF2E88" stroke-width="6" stroke-linejoin="round"/>
      <path d="M105 -10 L185 -40 L178 20 Z" fill="#14162A" stroke="#FF2E88" stroke-width="6" stroke-linejoin="round"/>
      <!-- body -->
      <ellipse cx="0" cy="0" rx="115" ry="95" fill="url(#body)" stroke="#FF2E88" stroke-width="7"/>
      <!-- angry brow -->
      <path d="M-70 -42 L-8 -14 M70 -42 L8 -14" stroke="#FF2E88" stroke-width="14" stroke-linecap="round"/>
      <!-- eye -->
      <circle cx="0" cy="18" r="46" fill="#FF2E2E" opacity="0.6" filter="url(#bigglow)"/>
      <circle cx="0" cy="18" r="40" fill="url(#eye)"/>
      <circle cx="-12" cy="6" r="10" fill="#FFFFFF" opacity="0.9"/>
    </g>

    <!-- impact sparks -->
    <g fill="#FFE45C" filter="url(#glow)">
      <path d="M672 300 l18 -42 l8 46 l40 -10 l-34 28 l30 30 l-44 -12 l-10 40 l-8 -42 l-40 8 z"/>
    </g>
    <g fill="#3CF0FF" filter="url(#glow)">
      <circle cx="300" cy="250" r="9"/><circle cx="760" cy="520" r="7"/><circle cx="250" cy="520" r="6"/>
    </g>

    <!-- DDS lettering -->
    <g transform="translate(512 860) skewX(-10)" text-anchor="middle"
       font-family="Arial Black, Segoe UI Black, Impact, sans-serif" font-weight="900" font-size="230" letter-spacing="10">
      <text x="10" y="14" fill="#FF2E88" opacity="0.9">DDS</text>
      <text x="0" y="0" fill="url(#chrome)" stroke="#12032B" stroke-width="10" paint-order="stroke">DDS</text>
    </g>
  </g>
</svg>
